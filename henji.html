<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>返事</title><style>
:root{font-size:17px;color-scheme:light;--paper:#f7f5ef;--ink:#303a3b;--quiet:#67716e;--line:#d4d8cf;--hover:#e9ede5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Yu Mincho','Hiragino Mincho ProN',serif;line-height:2.15}header{max-width:1000px;margin:auto;display:flex;justify-content:space-between;gap:16px;padding:20px 28px;font:14px/1.8 system-ui,sans-serif;color:var(--quiet)}.brand{letter-spacing:.35em}.settings{display:flex;gap:12px;flex-wrap:wrap}main{max-width:720px;margin:auto;padding:30px 30px 70px;min-height:80vh}#page{min-height:400px}#page:focus{outline:none}.chapter,.small{font:14px/1.9 system-ui,sans-serif;color:var(--quiet)}.chapter{letter-spacing:.12em;margin-bottom:38px}h1{font-size:clamp(58px,12vw,92px);font-weight:400;letter-spacing:.35em;margin:90px 0 70px}h2{font-size:1.25rem;font-weight:400;margin:0 0 28px}p{white-space:pre-line;margin:0 0 1.5em;overflow-wrap:anywhere}button,select{font:inherit;color:inherit}button{cursor:pointer;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 10px;line-height:1.9;text-align:left}button:hover{background:var(--hover)}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid #54716a;outline-offset:4px}select{background:transparent;border:0;border-bottom:1px solid var(--line)}.choices{display:grid;gap:12px;margin-top:36px}.turn{width:fit-content;min-width:100px}.interlude{min-height:380px;display:flex;align-items:center;font-size:1.13rem;letter-spacing:.06em}.blank{min-height:380px}nav{margin-top:50px;display:flex;gap:24px}nav button{border:0;font:14px/1.8 system-ui,sans-serif;color:var(--quiet)}footer{max-width:720px;margin:auto;padding:0 30px 28px;font:12px/1.8 system-ui,sans-serif;color:var(--quiet)}.reflection-item{margin:35px 0;padding-bottom:20px;border-bottom:1px solid var(--line)}.reflection-item h2{font-size:1rem}.answer{padding:20px 0;border-top:1px solid var(--line)}.enter{animation:arrive .7s ease both}@keyframes arrive{from{opacity:0}to{opacity:1}}body.instant .enter{animation:none}dialog{background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:30px;width:440px;max-width:90%}dialog::backdrop{background:#202a2966}@media(max-width:520px){header{padding:16px 20px}main{padding:20px 24px 45px}h1{margin-top:65px}.settings{gap:8px}footer{padding:0 24px 24px}}@media(prefers-reduced-motion:reduce){.enter{animation:none}}
</style></head><body><header><span class="brand">返事</span><div class="settings"><label>文字 <select id="size" aria-label="文字の大きさ"><option value="17">標準</option><option value="20">大きめ</option><option value="23">大きく</option></select></label><label><input type="checkbox" id="motion">すぐに表示</label></div></header><main><article id="page" tabindex="-1" aria-label="物語"></article><div id="choices" class="choices" aria-label="次の言葉・行動"></div><nav><button id="back" disabled>戻る</button><button id="home" hidden>表紙へ</button></nav><p id="save-note" class="small"></p></main><footer>対話を選ぶ短編 · 約10〜15分（立ち止まりながら読む：約15〜20分）<br>フィクションです。実際の看護手順を学ぶ教材ではありません。</footer><dialog id="restart"><p>今の読書位置を消して、初めから読みますか？</p><button id="yes">初めから読む</button><button id="no">戻る</button></dialog><script>
'use strict';
const story={
start:{chapter:'夜勤の前',p:['スマートフォンの下書きに、一行だけ残っている。','「今後の働き方について、ご相談があります」','ユウは画面を伏せた。\n何を相談したいのかを、そのあとに書けずにいた。'],next:'yuu'},
yuu:{chapter:'夜勤の前',p:['二十九歳。看護師になって七年目。\n点滴台を避けながら歩くことも、話の途中で時計を見ることも、目立たずできるようになった。','「今日、ユウさんとでよかった」\n後輩の言葉に「よろしくね」と返す。','うれしくないわけではない。\nただ、頼れる人の顔をしたまま、更衣室の鏡から離れるのに少し時間がかかった。'],next:'opening'},
opening:{chapter:'午前三時四十分',p:['「そこ、まだ閉じないで」','佐伯が言った。\nユウはカーテンにかけた手を止めた。','「いや、ノートのほう」','反対の手が、開いたページを押さえていた。'],next:'gap1'},
gap1:{gap:true,p:['同じ「そこ」を、見ていなかった。'],next:'saeki'},
saeki:{chapter:'病室',p:['佐伯修一、七十二歳。\n入院が延びた、と申し送りにあった。','ベッドの脇のノートには、鎧を着た男がいる。剣より、靴のほうが丁寧に描かれている。','「製本をやってたんだ。絵は、辞めてから」\n佐伯は紙の端を親指でそろえた。\n「ここがずれるの、どうしても気になってね」','鉛筆を持ち直すとき、眉間にしわが寄った。'],choices:[['「今、つらいところはありますか」','body',{first:'body'}],['「一人で頑張りすぎなくても、大丈夫ですよ」','encourage',{first:'encourage'}],['「描き直しているんですか。さっき、眉を寄せられたので」','drawing',{first:'drawing'}]]},
body:{chapter:'病室',p:['「背中がね。さっきから、少し」','ユウは鉛筆から目を離した。\n痛みについて確かめる間、佐伯はノートを開いたままにしていた。'],next:'care'},
encourage:{chapter:'病室',p:['鉛筆が止まった。','「……何を？」','「描くのが、つらそうだったので」\n説明すると、自分の言葉が少し早くなる。','「手を描き直してるんだ。人の手に見えなくて」\n佐伯はページを見たままだった。'],next:'gap2'},
gap2:{gap:true,p:['返事が来る前に、\n話の続きを決めていた。'],choices:[['「そうだったんですね。今、身体でつらいところはありますか」','repair',{repair:'ask'}],['「そうでしたか。無理はしないでくださいね」','dismiss',{repair:'close'}]]},
repair:{chapter:'病室',p:['「背中は、ちょっと痛い」','「いつからですか」\n今度は、答えの続きを待った。'],next:'care'},
dismiss:{chapter:'病室',p:['「はいはい」','ユウがノートから手を離したとき、佐伯が言った。\n「絵の話はいいんだけど。背中のこと、聞いてもらってもいい？」','ユウは足を止めた。\n「はい。教えてください」'],next:'care'},
drawing:{chapter:'病室',p:['「そう。手って、難しいね」\n佐伯は鉛筆の先で、消し跡をなぞった。','少し身体を動かして、息を止める。\n「それとは別に、背中が痛くてね」','ユウはノートから顔を上げた。\n「今の痛みについて、教えてください」'],next:'care'},
care:{chapter:'午前四時すぎ',p:['痛みの様子と身体の状態を確認し、必要な対応をチームと進めた。\nもう一度訪ねると、佐伯は「さっきより楽」と言った。','「ノート、閉じましょうか」\n「そこに置いておいて。開いたままで」','ユウは頼まれた場所を確かめてから置いた。'],next:'return'},
return:{chapter:'病室',p:['「孫に描いてるんだ。はるっていう。二年生」','聞いていないことを、佐伯のほうから話し始めた。\n「今どこまで来たって、娘経由で催促が来る」','表紙の隅に、小さく「はるへ」とあった。'],choices:[['「お孫さんのために、仕上げたいんですね」','forgrandchild',{meaning:'grandchild'}],['「佐伯さんは、どんな続きを描きたいですか」','forhim',{meaning:'him'}]]},
forgrandchild:{chapter:'描きかけのページ',p:['「まあ、そうなんだけど」','佐伯は消しゴムの角を指でつぶした。\n「俺も気になるんだよ。この男が、どう帰るのか」','孫のため。\nその言葉で、全部分かったような気がしていた。'],next:'profile'},
forhim:{chapter:'描きかけのページ',p:['「そこが、まだね」','佐伯の指が、鎧の男の靴をたどった。\n「娘には、さっさと帰らせてあげなよって言われる。でも、俺が納得してない」','少し笑った。\n「孫より、俺のほうが待ってるのかもしれない」'],next:'profile'},
profile:{chapter:'描きかけのページ',p:['「女房がいたら、そんな靴じゃ歩けないって言うだろうな」','佐伯は靴の横に一本、線を足した。\n妻が亡くなったのは四年前だという。\n娘にはいつも「忙しいだろ」と言ってしまい、そのあとで聞きたかったことを思い出すらしい。','「この男、帰るって約束しちゃったからね」\n鉛筆の先が、白いコマの手前で止まる。'],next:'silence'},
silence:{chapter:'病室',p:['「勝って帰るところが、どうも描けなくて」','佐伯は黙った。\n廊下で、台車の車輪が短く鳴った。'],choices:[['「仲間の手を借りて帰るのは、どうでしょう」','suggest',{approach:'suggest'}],['「描けないのは、どのあたりですか」','ask',{approach:'ask'}],['少し待つ','quiet',{approach:'wait'}]]},
suggest:{chapter:'病室',p:['「助けてもらうのか」','佐伯は、鎧の男を見ていた。\n「それで、はるは面白がるかな」','ユウには、よい結末に思えた。\nそれは、佐伯の続きを聞く前だった。'],choices:[['「どんなところを、はるさんに読んでほしいですか」','promise',{response:'ask'}],['「佐伯さんの考えている帰り方も、聞きたいです」','rope',{response:'listen'}],['「そうですね。今、結末を決めなくてもいいですね」','hold',{response:'hold'}]]},
ask:{chapter:'病室',p:['「帰りたいくせに、帰ると終わっちゃうだろ」','佐伯はページを一枚戻した。\n「この男のこと、描いてるうちに気に入っちゃってさ」','帰りたい。終わらせたくない。\nどちらかを、言い間違えたわけではなさそうだった。'],next:'rope'},
quiet:{gap:true,blank:true,p:[],next:'waitreply'},
waitreply:{chapter:'病室',p:['「……ユウさん？」','佐伯が顔を上げた。\n「こういう話、困る？」','待っていたつもりだった。\n待っていることは、伝わっていなかった。'],choices:[['「困ってはいません。続きを考えていました」','rope',{response:'explain'}],['「どう返したらいいか、迷っていました」','honest',{response:'honest'}]]},
honest:{chapter:'病室',p:['「そんなに難しく考えなくても」\n佐伯は言ってから、鉛筆を置いた。','「いや。俺が難しくしてるんだな」','ユウは、どちらにもすぐにうなずけなかった。'],next:'rope'},
promise:{chapter:'描きかけのページ',p:['「帰るって言ったことは、覚えててほしいかな」','佐伯はノートの端をそろえた。\n「でも、約束を守る話にしたいのか、かっこつけたいだけなのか。自分でも分からないね」'],next:'rope'},
hold:{chapter:'描きかけのページ',p:['「そうだね。決めないでおくか」','佐伯は鉛筆を持ち上げ、また置いた。\n「でも、一つだけ、考えてることはあるんだ」'],next:'rope'},
rope:{chapter:'描きかけのページ',p:['「剣をね、ここで置いていくんだ」','佐伯が白いコマを指さした。\n「かわりに、縄を持って帰る。道の途中に橋がなくてさ」','「誰かを渡すんですか」\n「まだ分からない。自分が渡れないのかもしれない」','ユウは、その先を描き足したくなった。'],next:'gap3'},
gap3:{gap:true,p:['鉛筆は、佐伯の手にあった。'],next:'choiceend'},
choiceend:{chapter:'午前四時半',p:['佐伯は目元をこすった。\nユウも時計を見る。ほかの病室を回る時間だった。','「そろそろ、いったん失礼します。今はどうしていたいですか」','「一コマだけ描くか、寝るか。迷ってる」'],choices:[['「一コマの、どこまで描けたら区切れそうですか」','onepanel',{ending:'draw'}],['「ノートを開いたまま、少し休みますか」','rest',{ending:'rest'}],['「決めずに置いておくのも、ありでしょうか」','undecided',{ending:'open'}]]},
onepanel:{chapter:'病室を出る前に',p:['「縄だけ。手は、明日にする」','佐伯は言った。\nユウは手元の灯りや必要なものを確かめた。\nつらさが増したら知らせてもらうことを伝え、病室を出る。','振り返ると、佐伯はまだ、何も描いていなかった。'],next:'handover'},
rest:{chapter:'病室を出る前に',p:['「開いたままでいいの？」\n「どこに置きましょうか」','佐伯が指したのは、さっきより少し遠い場所だった。\nユウはそこにノートを置き、休みやすいよう本人と確かめた。','「寝たら、いい続きを思いつくかな」\n「どうでしょうね」\n二人とも、少しだけ笑った。'],next:'handover'},
undecided:{chapter:'病室を出る前に',p:['「それ、得意だよ。決めないで置いとくの」','佐伯は鉛筆を、ノートの中央に寝かせた。\n「娘には怒られるけどね」','ユウは必要なものと呼び出しの方法を確かめて、病室を出た。\nそのあと佐伯が描いたのか、休んだのかは、まだ知らない。'],next:'handover'},
handover:{chapter:'午前七時十分',p:['交代の看護師に、痛みの経過と対応、その後の様子を伝える。\nノートは本人が希望した場所にあることも、付け加えた。','「漫画を描かれてるんですね」','「はい」\n孫のために、と言いかけて、ユウは続けた。\n「ご自分でも、続きを楽しみにしているみたいです」'],next:'colleague'},
colleague:{chapter:'更衣室の前',p:['後輩が言った。\n「ユウさんって、患者さんと何を話せばいいか、すぐ分かりますよね」','いつもの返事が、口の近くまで来た。'],choices:[['「今日は、分からなくて聞き直したよ」','colleaguehonest',{self:'share'}],['「そう見える？」','colleaguequestion',{self:'question'}],['「お疲れさま。また今度、話そう」','colleaguelater',{self:'later'}]]},
colleaguehonest:{chapter:'更衣室の前',p:['「そうなんですか」','後輩は少し驚いた顔をした。\nユウはうなずいた。','それ以上を、うまく説明できたわけではなかった。'],next:'home'},
colleaguequestion:{chapter:'更衣室の前',p:['「はい。迷ってるように見えないので」','「そっか」','自分が見せている顔を、ユウは鏡より先に知った。'],next:'home'},
colleaguelater:{chapter:'更衣室の前',p:['「お疲れさまでした」','後輩はロッカーのほうへ歩いていった。\nユウはその背中を見送った。','今度、と思った。\nいつにするかは、まだ決めていない。'],next:'home'},
home:{chapter:'帰宅',p:['途中まで見た映画が、昨日のところで止まっている。\n洗ったマグカップを出して、結局、水を飲んだ。','スマートフォンの下書きを開く。\n「今後の働き方について、ご相談があります」','辞めたいのが、この仕事なのか。\n今の働き方なのか。\n頼れる顔をしたままの、自分なのか。','佐伯と話したからといって、分かるようにはならなかった。'],next:'lastgap'},
lastgap:{gap:true,p:['「今、何がいちばんつらいですか」'],next:'last'},
last:{chapter:'帰宅',p:['患者には、何度も尋ねてきた言葉だった。','ユウは相談の文面を閉じ、新しいメモを開いた。','すぐには、何も書かなかった。'],next:'coverend'}
};
const page=document.getElementById('page'),choices=document.getElementById('choices'),back=document.getElementById('back'),home=document.getElementById('home'),note=document.getElementById('save-note');
const key='henji-reading-v2';let trail=[],state={},current='cover',mode='story',pendingMode='story',onCover=true,reflecting=false,canSave=true;
const groups={body:1,encourage:1,drawing:1,suggest:2,ask:2,waitreply:2,colleaguehonest:3,colleaguequestion:3,colleaguelater:3};
function make(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function p(text,parent=page){parent.append(make('p',text));}
function button(label,fn,parent=choices){const b=make('button',label);b.type='button';b.onclick=fn;parent.append(b);return b;}
function valid(id){return !!story[id]||id==='coverend'||/^@(?:q|f)[123]$/.test(id);}
function snapshot(){return {current,state:JSON.parse(JSON.stringify(state)),mode};}
function persist(){try{localStorage.setItem(key,JSON.stringify({trail,...snapshot()}));}catch(e){canSave=false;note.textContent='この環境では読書位置を保存できません。';}}
function clear(){page.replaceChildren();choices.replaceChildren();page.className='';back.hidden=false;back.disabled=false;home.hidden=false;note.textContent=canSave?'':'読書位置はこの環境では保存されません。';}
function focusPage(){page.focus({preventScroll:true});window.scrollTo(0,0);}
function go(id,patch={}){trail.push(snapshot());state={...state,...patch};current=id;persist();render();}
function cover(after=false){clear();onCover=true;reflecting=false;home.hidden=true;back.disabled=current==='cover';if(after)page.append(make('p','物語は、ここで終わりです','chapter'));page.append(make('h1','返事'));if(after){p('自分の返事は、まだ待っていなかった。');button('選んだ言葉を振り返る',reflection);button('物語をもう一度読む',()=>requestBegin('story'));button('立ち止まりながらもう一度読む',()=>requestBegin('guided'));p('「戻る」で最後の場面へ戻れます。振り返りは、読みたいときに。');}else{p('ある夜の、佐伯とユウ。\n言葉を選び、自分の速さでページをめくる短編。');if(valid(current))button('続きから読む',render);button('物語を読む',()=>requestBegin('story'));button('立ち止まりながら読む',()=>requestBegin('guided'));p('「立ち止まりながら読む」では、3場面に短い問いと解説が入ります。一人で振り返る手がかりに。');}page.append(make('p','音声・画像はありません。待つ長さや選択に点数は付きません。','small'));focusPage();}
function requestBegin(m){pendingMode=m;if(current!=='cover')document.getElementById('restart').showModal();else begin(m);}
function begin(m){trail=[];state={};mode=m;current='start';persist();render();}
function selected(source){for(let i=trail.length-1;i>=0;i--){const t=trail[i];if(t.current!==source)continue;const dest=trail[i+1]?.current||current;const c=story[source]?.choices?.find(c=>c[1]===dest);if(c)return c[0];}return '';}
function checkpoint(n){if(n===1)return {title:'見えたことと、推測したこと',quote:'鉛筆を持ち直すとき、眉間にしわが寄った。',question:'最初に声をかける直前、本文から分かっていたのは？',options:['佐伯が眉を寄せたこと','佐伯が無理をしていること','佐伯が励ましを求めていること'],feedback:['そうです。眉を寄せたことは、本文に描かれた観察です。その理由は、まだ本人に確かめていません。','無理をしている可能性は考えられます。ただ、声をかける前の時点では推測です。本文に描かれていたのは、眉を寄せたことでした。','励ましてほしいと感じたのかもしれません。ただ、その希望はまだ聞いていません。本文に描かれていたのは、眉を寄せたことでした。'],takeaway:state.first==='encourage'?'励まそうとした気持ちと、佐伯が求めていることは、重なるとは限りません。次の返事を聞いて、理解を直す余地があります。':state.first==='drawing'?'絵に注目した問いから、別のつらさも話されました。最初の見立てに収まらない返事も、その人を知る手がかりです。':'身体のつらさを尋ねると、背中の痛みが語られました。質問する前に分かっていたことと、質問して初めて分かったことを区別できます。',action:'次に試すなら：「眉を寄せられましたが、今、何かつらいことはありますか」。観察を手がかりに、理由を本人に尋ねる言い方です。'};
if(n===2){if(state.approach==='wait')return {title:'意図と、伝わったこと',quote:'佐伯「こういう話、困る？」',question:'この返事から言えるのは？',options:['待つ意図が、そのまま伝わったとは言えない','沈黙はいつでも避けるべきだ','佐伯はユウを信用していない'],feedback:['そうです。佐伯は「困る？」と確かめています。待つ意図が、そのまま伝わったとは言えません。','この場面で意図が伝わりにくかったことは読み取れます。ただ、この一例から沈黙をすべて不適切とは言えません。','信用していないとまでは本文から分かりません。「困る？」という問いを、関係全体の評価に広げないことが大切です。'],takeaway:'待ったことだけで正解にも不正解にもなりません。自分の意図と相手の受け取り方のずれに気づき、そのあとどう伝え直すかが残っています。',action:'次に試すなら：「続きを考えていました。もう少し聞いてもいいですか」。意図を言葉にし、相手の希望を確かめられます。'};
if(state.approach==='ask')return {title:'聞いて、増えたこと',quote:'佐伯「帰りたいくせに、帰ると終わっちゃうだろ」',question:'佐伯の言葉から、今受け取れるのは？',options:['帰りたい気持ちと、終わらせたくない気持ちがある','本当は帰りたくない','ユウに結末を決めてほしい'],feedback:['そうです。帰りたい一方、物語を終えることにはためらいが語られています。どちらかを消さずに受け取れます。','終わらせたくないとは話していますが、帰りたい気持ちが嘘だとは言っていません。両方ある可能性が残っています。','ここでは迷いを話しています。結末を決めてほしいという依頼は、まだありません。'],takeaway:'話を聞くと、一つの理由では説明できない思いが出てくることがあります。すぐ整理しきれなくても、もう少し聞くことができます。',action:'次に試すなら：「帰らせたいけれど、物語は続けたい感じでしょうか」。自分の受け取り方を、訂正できる形で返してみます。'};
return {title:'提案と、相手の望み',quote:'佐伯「それで、はるは面白がるかな」',question:'この返事を読んだ時点で、どこまで分かる？',options:['はるが面白がるか、佐伯は気にしている','佐伯は提案を拒絶した','佐伯は提案に納得した'],feedback:['そうです。佐伯は、はるの反応を問いにしています。提案を採用したいかどうかは、まだ確かめられていません。','疑問は示されていますが、拒絶とまでは言っていません。何が気になるのかを尋ねる余地があります。','納得したとは、まだ言っていません。自分によい案だと思えたことと、相手が望むことは別に確かめる必要があります。'],takeaway:'よい案を思いついても、本人が何を大切にしたいかは、提案への反応からさらに聞けます。',action:'次に試すなら：「どんなところを、はるさんに読んでほしいですか」。案の採否を急ぐ前に、大切にしたいことを尋ねます。'};}
return {title:'自分が守りたかったもの',quote:selected('colleague'),question:'この返事を選んだとき、自分の気持ちに近いのは？',options:['迷う自分も、知ってもらいたかった','相手からどう見えるか、知りたかった','今は説明せず、自分の余裕を守りたかった','別の理由だった／まだ分からない'],feedback:['その意図に気づいたことが、ここでの手がかりです。迷いを話すことへの安心やためらいは、ありましたか。','見られている自分と、自分が感じる自分。その間に、どんな違いが気になったのでしょう。','今は話さない選択には、余裕を守る意味もあり得ます。後で話したいのか、話さずにいたいのかも、まだ考えられます。','今すぐ一つの理由に決めなくても大丈夫です。「何を言いたくなかったか」から考える方法もあります。'],takeaway:'ここには正解はありません。一度の選択から性格を決めず、「この場面では、こうしたかった」と受け止めます。',action:'次に試すなら：この場面に戻り、別の言葉を選んだとき、自分が楽になるのか、落ち着かなくなるのかを比べてみてください。'};}
function showQuestion(n,feedback=false){const c=checkpoint(n);page.append(make('p',`少し立ち止まる · ${n} / 3`,'chapter'));page.append(make('h2',c.title));p(c.quote);if(!feedback){p(c.question);c.options.forEach((label,i)=>button(label,()=>go('@f'+n,{['answer'+n]:i})));button('今は考えず、物語へ戻る',()=>go(state.resume,{['done'+n]:true,['answer'+n]:null}));}else{const a=state['answer'+n];p('選んだ答え：'+c.options[a]);const block=make('section',undefined,'answer');p(c.feedback[a],block);p(c.takeaway,block);p(c.action,block);page.append(block);button('この場面に戻って続ける',()=>go(state.resume,{['done'+n]:true}));}page.append(make('p',n===3?'正誤の判定ではなく、今の自分を確かめる問いです。':'本文の根拠を確かめる問いです。あなたの人格や看護能力を判定するものではありません。','small'));}
function render(){if(current==='coverend'){cover(true);return;}clear();onCover=false;reflecting=false;if(current[0]==='@'){showQuestion(Number(current.slice(2)),current[1]==='f');focusPage();return;}const node=story[current];if(!node){cover();return;}if(node.chapter)page.append(make('p',node.chapter,'chapter'));const prose=make('div',undefined,node.gap?(node.blank?'blank':'interlude'):'');if(node.blank){prose.setAttribute('role','note');prose.setAttribute('aria-label','言葉のない余白。自分の速さで次のページへ進めます。');}node.p.forEach(t=>p(t,prose));page.append(prose);const n=groups[current];if(mode==='guided'&&n&&!state['done'+n]){button('少し立ち止まる',()=>go('@q'+n,{resume:current}));}else if(node.choices){node.choices.forEach(([label,id,patch])=>button(label,()=>go(id,patch)));}else button(current==='last'?'物語を閉じる':'ページをめくる',()=>go(node.next)).className='turn';page.className='enter';focusPage();}
const prompts={saeki:'見えていた事実と、自分の推測を分けるとどうなりますか。',gap2:'すれ違いに気づいたあと、何を確かめようとしましたか。',return:'佐伯が描く理由を、どこまで聞く前に想像していましたか。',silence:'どんな返事が来ると期待していましたか。',suggest:'自分の提案と佐伯の望みが違うかもしれないとき、何を大切にしましたか。',waitreply:'待つ意図が伝わらなかったとき、どんな気持ちになりましたか。',choiceend:'この場面で何を優先したかったのでしょう。',colleague:'ユウの迷いを、どこまで他者に見せたいと思いましたか。'};
function reflection(){clear();onCover=false;reflecting=true;home.hidden=true;page.append(make('h2','選んだ言葉の、そのあと'));p('気になった場面を一つだけ。何を期待し、返事に何を感じ、そのあとどうしたくなったかを振り返ります。性格診断でも、看護の採点でもありません。');trail.forEach((entry,i)=>{const node=story[entry.current];if(!node?.choices)return;const dest=trail[i+1]?.current||current;const choice=node.choices.find(c=>c[1]===dest);if(!choice)return;const block=make('section',undefined,'reflection-item');block.append(make('h2',choice[0]));if(story[dest]?.p.length)p('返ってきた言葉・反応：'+story[dest].p.slice(0,2).join('\n'),block);p(prompts[entry.current]||'この場面で、何を守ろうとしていましたか。',block);button('この場面に戻って読み直す',()=>{current=entry.current;state=JSON.parse(JSON.stringify(entry.state));mode=entry.mode||mode;trail=trail.slice(0,i);persist();render();},block);page.append(block);});if(mode==='guided'){page.append(make('h2','立ち止まった問い'));for(let n=1;n<=3;n++){const a=state['answer'+n];if(!Number.isInteger(a))continue;const c=checkpoint(n);p(c.title+'\n選んだ答え：'+c.options[a]);p(c.feedback[a]);}}p('「私はこういう人だ」と決めず、「この場面では、こうしたかった」と言葉にする。別の選択を試したら、相手の返事だけでなく、自分の感じ方も比べてみてください。');button('物語の終わりへ戻る',()=>cover(true));focusPage();}
back.onclick=()=>{if(reflecting){cover(true);return;}if(onCover&&current!=='coverend'){if(valid(current))render();return;}const previous=trail.pop();if(previous){current=previous.current;state=previous.state;mode=previous.mode||mode;persist();render();}else cover();};home.onclick=()=>cover();document.getElementById('yes').onclick=()=>{document.getElementById('restart').close();begin(pendingMode);};document.getElementById('no').onclick=()=>document.getElementById('restart').close();document.getElementById('size').onchange=e=>{document.documentElement.style.fontSize=e.target.value+'px';};document.getElementById('motion').onchange=e=>document.body.classList.toggle('instant',e.target.checked);
try{const saved=JSON.parse(localStorage.getItem(key)||localStorage.getItem('henji-reading-v1')||'null');if(saved&&valid(saved.current)&&Array.isArray(saved.trail)&&saved.trail.every(t=>valid(t.current))&&saved.state&&typeof saved.state==='object'){current=saved.current;state=saved.state;mode=saved.mode==='guided'?'guided':'story';trail=saved.trail.map(t=>({...t,mode:t.mode||mode}));}}catch(e){canSave=false;}
cover(current==='coverend');
</script></body></html>
